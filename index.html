<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バディファイト</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/coach.css">
</head>
<body>
    <div id="app">
        <header id="header-bar">
            <span id="undo-slot"></span>
            <span id="phase-indicator"></span>
            <span id="buttons"></span>
        </header>

        <div id="opponent-hand" class="hand-bar"></div>

        <main id="game-container">
            <section class="player-field opponent-side" id="top"></section>
            <div id="center-divider"></div>
            <section class="player-field my-side" id="bottom"></section>
            <div id="cast-layer"></div>
        </main>

        <div id="my-hand" class="hand-bar"></div>

        <aside id="side-panel">
            <div id="menu-buttons"></div>
            <div id="log"></div>
        </aside>
    </div>

    <div id="preview"></div>

    <div id="prompt-bar"></div>
    <div id="gauge-pop" class="modal-overlay"></div>
    <div id="zoom" class="modal-overlay">
        <div class="zoom-box">
            <div id="zoom-title"></div>
            <div id="zoom-card"></div>
            <div id="zoom-buttons"></div>
        </div>
    </div>
    <div id="fx-layer"></div>
    <div id="result" class="modal-overlay"></div>
    <div id="prompt" class="modal-overlay">
        <div class="modal-content">
            <h3 id="prompt-title"></h3>
            <div id="prompt-card"></div>
            <div id="prompt-buttons"></div>
        </div>
    </div>
    <div id="mode-choice" class="modal-overlay">
        <div class="modal-content">
            <h3>どちらで遊ぶ？</h3>
            <div id="mode-buttons"></div>
            <p id="mode-note" class="muted"></p>
        </div>
    </div>

    <script src="/socket-shim.js"></script>
    <script src="/game.js"></script>
    <script src="/coach.js"></script>
</body>
</html>
